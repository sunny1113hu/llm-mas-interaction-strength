project:
  name: cec2026
paths:
  outputs_root: outputs/runs
dataset:
  type: consensus
  consensus:
    range_list:
      - [0, 25]
    sigma: 0.5
    sigma_list:
      - 0.5
  diffusion:
    range_list:
      - [0, 25]
    source_value: 25
    sink_value: 0
    sigma: 0.5
    sigma_list:
      - 0.5
simulation:
  grid_size: 4
  steps: 10
  seed: 42
  seed_list:
    - 42
    - 1
    - 7
    - 11
    - 19
    - 17
    - 29
    - 35
    - 44
    - 49
  mu_list:
    - -5.0
    - -4.5
    - -4.0
    - -3.5
    - -3.0
    - -2.5
    - -2.0
    - -1.75
    - -1.5
    - -1.25
    - -1.0
    - -0.75
    - -0.5
    - -0.25
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
    - 1.25
    - 1.5
    - 1.75
    - 2.0
    - 2.5
    - 3.0
    - 3.5
    - 4.0
    - 4.5
    - 5.0
run_one:
  num_problems: 1
  steps: 10
  mu: -5
run_sweep:
  num_problems: 1
  make_figures: true
  multi_model: false
llm:
  backend: openai_compatible
  base_url: http://localhost:8000/v1
  model: baseline/pressure_raw
  temperature: 0.2
  max_tokens: 256
  timeout_s: 60
  response_format: json_object
prompt:
  include_pi: false
policy:
  kind: pressure_raw
models:
  model_list:
    - model_id: baseline/pressure_raw
      policy_kind: pressure_raw
