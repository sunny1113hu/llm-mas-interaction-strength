services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - MODEL_ID=${MODEL_ID:-Qwen/Qwen3-8B}
      - MODEL_SUBDIR=${MODEL_SUBDIR:-Qwen3-8B}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-32768}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.9}
    entrypoint:
      - vllm
    command:
      - serve
      - /models/${MODEL_SUBDIR:-Qwen3-8B}
      - --served-model-name
      - ${MODEL_ID:-Qwen/Qwen3-8B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${MAX_MODEL_LEN:-32768}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.9}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  swarm:
    build: .
    depends_on:
      - vllm
    environment:
      - LLM_BASE_URL=http://vllm:8000/v1
    volumes:
      - .:/app
    command: ["python", "-m", "scripts.run_one", "--config", "configs/default.yaml"]
