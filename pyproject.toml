[project]
name = "llm-mas-interaction-strength"
version = "1.0.0"
description = "Distributed LLM multi-agent simulation for studying interaction strength as a tunable design variable"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Taiyo Sato"}]

dependencies = [
  "httpx>=0.27.0",
  "huggingface-hub>=1.2.3",
  "imageio>=2.34.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.data", "src.llm_backend", "src.swarm", "src.utils", "scripts"]
